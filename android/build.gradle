allprojects {
    repositories {
        // SE Asia / Indonesia fast mirrors — Alibaba Cloud CDN
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }

    // Aggressive caching — avoids re-downloading on slow connections
    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 365, 'days'
        resolutionStrategy.cacheDynamicVersionsFor 365, 'days'

        // Pin androidx.core to a version compatible with compileSdk 34 + AGP 8.1.4.
        // Newer transitive versions (1.16.x) require compileSdk 35 and AGP 8.6+,
        // which would force a full toolchain upgrade.
        resolutionStrategy.force 'androidx.core:core:1.13.1'
        resolutionStrategy.force 'androidx.core:core-ktx:1.13.1'
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
