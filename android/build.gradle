buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        // SE Asia / Indonesia friendly mirrors — resolves Maven Central artifacts
        // via Alibaba Cloud CDN which has fast routing to Southeast Asia
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }

    // Aggressive caching — avoids re-downloading on slow connections
    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 365, 'days'
        resolutionStrategy.cacheDynamicVersionsFor 365, 'days'
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
