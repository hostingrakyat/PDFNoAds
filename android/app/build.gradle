plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// upload-key.jks is decoded by CI from the KEYSTORE_BASE64 secret.
// When the file is absent (local dev / no secrets), fall back to debug signing.
def keystoreFile = file("upload-key.jks")
def hasKeystore  = keystoreFile.exists()

android {
    namespace "com.pdfnoads.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile     keystoreFile
                storePassword System.getenv("STORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")      ?: ""
                keyPassword   System.getenv("KEY_PASSWORD")   ?: ""
            } else {
                // Local / no-secret builds stay signed with the debug key
                def debugKs = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storeFile     debugKs.exists() ? debugKs : null
                storePassword "android"
                keyAlias      "androiddebugkey"
                keyPassword   "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.pdfnoads.app"
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
