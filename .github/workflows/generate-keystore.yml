name: "Setup: Generate Signing Keystore"

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Your full name (goes into the certificate)"
        required: true
        default: "Ir. Riovan Styx Roring"
      org:
        description: "Organization / company name"
        required: true
        default: "hostingrakyat"

jobs:
  generate:
    name: Generate JKS and set secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate keystore + set GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Random secure passwords — never stored anywhere except as secrets
          STORE_PASS=$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 36)
          KEY_PASS=$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 36)
          KEY_ALIAS="upload"

          keytool -genkey -v \
            -keystore upload-key.jks \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${{ inputs.full_name }}, OU=Android, O=${{ inputs.org }}, L=Balikpapan, ST=East Kalimantan, C=ID"

          KEYSTORE_B64=$(base64 -w 0 upload-key.jks)

          # Push all four secrets directly into this repo
          echo "$KEYSTORE_B64"  | gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}"
          echo "$KEY_ALIAS"     | gh secret set KEY_ALIAS        --repo "${{ github.repository }}"
          echo "$KEY_PASS"      | gh secret set KEY_PASSWORD     --repo "${{ github.repository }}"
          echo "$STORE_PASS"    | gh secret set STORE_PASSWORD   --repo "${{ github.repository }}"

          # Tidy up — keystore never touches the repo or logs
          rm -f upload-key.jks

          echo "## ✅ Keystore generated and secrets saved!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following secrets are now set on this repository:" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEYSTORE_BASE64\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`STORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Push a commit to trigger a signed AAB + APK build. 🚀" >> $GITHUB_STEP_SUMMARY
