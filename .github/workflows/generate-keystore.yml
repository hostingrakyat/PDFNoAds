name: "Setup: Generate Signing Keystore"

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: "Your full name (goes into the certificate)"
        required: true
        default: "Ir. Riovan Styx Roring"
      org:
        description: "Organization / company name"
        required: true
        default: "hostingrakyat"

jobs:
  generate:
    name: Generate JKS and set secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate keystore
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # One password for both store + key (-storetype JKS avoids the
          # PKCS12 "ignoring keypass" warning from Java 17+)
          PASS=$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 36)
          KEY_ALIAS="upload"

          keytool -genkey -v \
            -keystore upload-key.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=${{ inputs.full_name }}, OU=Android, O=${{ inputs.org }}, L=Balikpapan, ST=East Kalimantan, C=ID"

          KEYSTORE_B64=$(base64 -w 0 upload-key.jks)
          rm -f upload-key.jks

          # ── Auto mode: GH_PAT secret is set → push secrets via gh CLI ──
          if [ -n "$GH_TOKEN" ]; then
            echo "$KEYSTORE_B64" | gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}"
            echo "$KEY_ALIAS"    | gh secret set KEY_ALIAS        --repo "${{ github.repository }}"
            echo "$PASS"         | gh secret set KEY_PASSWORD     --repo "${{ github.repository }}"
            echo "$PASS"         | gh secret set STORE_PASSWORD   --repo "${{ github.repository }}"

            {
              echo "## ✅ Done — secrets set automatically!"
              echo "All 4 signing secrets are now saved to this repo."
              echo "Push any commit to build a signed APK + AAB. 🚀"
            } >> "$GITHUB_STEP_SUMMARY"

          # ── Manual mode: no GH_PAT → print values to job summary ──────
          else
            {
              echo "## 📋 Add these 4 secrets manually"
              echo ""
              echo "Go to: **Repo → Settings → Secrets and variables → Actions → New repository secret**"
              echo ""
              echo "---"
              echo "### KEYSTORE_BASE64"
              echo '```'
              echo "$KEYSTORE_B64"
              echo '```'
              echo "### KEY_ALIAS"
              echo '```'
              echo "$KEY_ALIAS"
              echo '```'
              echo "### KEY_PASSWORD"
              echo '```'
              echo "$PASS"
              echo '```'
              echo "### STORE_PASSWORD"
              echo '```'
              echo "$PASS"
              echo '```'
              echo ""
              echo "> ⚠️ Copy all values now — re-running generates a NEW keystore."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
