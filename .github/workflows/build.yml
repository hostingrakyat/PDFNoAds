name: Build & Release APK

on:
  push:
    branches:
      - claude/flutter-pdf-reader-app-qwd5Q
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Create local.properties
        run: |
          FLUTTER_SDK=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties
          echo "--- Flutter SDK exists ---"
          ls "$FLUTTER_SDK/packages/flutter_tools/gradle/" | head -10

      - name: Build release APK (verbose)
        run: |
          flutter build apk --release --no-pub --verbose 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "========== BUILD FAILED — last 150 lines =========="
            grep -E "error:|Error:|FAILURE|Exception|> Task|Caused by:" /tmp/build.log | tail -50
            echo "============================================"
            tail -80 /tmp/build.log
            exit $EXIT
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PDFNoAds-v1.0.0.apk
          ls -lh dist/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFNoAds-APK
          path: dist/PDFNoAds-v1.0.0.apk
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Delete existing release if present
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          git push --delete origin v1.0.0 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF No Ads v1.0.0 — Free PDF Reader"
          body: |
            ## PDF No Ads — Free PDF Reader, No Ads, Forever

            **Day 1 of 365 Days App Challenge by Ir. Riovan Styx Roring**

            ### Install
            1. Download `PDFNoAds-v1.0.0.apk` below
            2. On your Android phone: Settings → Security → Allow unknown sources
            3. Open the downloaded APK and install

            ### Features
            - 📄 Open & read any PDF file
            - 🌙 Night mode for comfortable reading
            - 🌐 English & Bahasa Indonesia
            - 🔗 Set as default PDF app
            - **Zero ads. Free forever.**

            ---
            Created by: **Ir. Riovan Styx Roring**
            📱 [TikTok](https://www.tiktok.com/@ir.riovansroring) · [Instagram](https://www.instagram.com/ir.riovansroring/) · [YouTube](https://www.youtube.com/@ir.riovansroring)
          files: dist/PDFNoAds-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
