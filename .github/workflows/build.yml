name: Build & Release APK + AAB

on:
  push:
    branches:
      - claude/flutter-pdf-reader-app-qwd5Q
      - claude/pdf-viewer-bugs-features-thrwa
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses 2>/dev/null || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create local.properties
        run: |
          FLUTTER_SDK=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Decode keystore (if secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-key.jks
            echo "✅ Keystore decoded — release signing enabled"
          else
            echo "ℹ️  No KEYSTORE_BASE64 secret — using debug signing"
          fi

      - name: Build release APK
        run: flutter build apk --release --verbose 2>&1 | tee /tmp/build.log; EXIT=${PIPESTATUS[0]}; [ $EXIT -eq 0 ] || { tail -200 /tmp/build.log; exit $EXIT; }
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

      - name: Build release AAB (Play Store)
        run: flutter build appbundle --release 2>&1 | tee -a /tmp/build.log; EXIT=${PIPESTATUS[0]}; [ $EXIT -eq 0 ] || { tail -200 /tmp/build.log; exit $EXIT; }
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk   dist/PDFNoAds-v1.0.1.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/PDFNoAds-v1.0.1.aab
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFNoAds-APK
          path: dist/PDFNoAds-v1.0.1.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFNoAds-AAB
          path: dist/PDFNoAds-v1.0.1.aab
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Delete existing release if present
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete v1.0.1 --yes 2>/dev/null || true
          git push --delete origin v1.0.1 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PDF No Ads v1.0.1 — Free PDF Reader"
          body: |
            ## PDF No Ads — Free PDF Reader, No Ads, Forever

            **Day 1 of 365 Days App Challenge by Ir. Riovan Styx Roring**

            ### Install (APK — direct sideload)
            1. Download `PDFNoAds-v1.0.1.apk` below
            2. On your Android phone: Settings → Security → Allow unknown sources
            3. Open the downloaded APK and install

            ### Play Store (AAB)
            Upload `PDFNoAds-v1.0.1.aab` to Google Play Console.

            ### What's new in v1.0.1
            - 🐛 Fixed blank white page when opening PDFs
            - ✨ Animated loading screen while PDF opens
            - 🔗 Fixed social media links not opening
            - 🔗 Fixed YouTube link

            ### Features
            - 📄 Open & read any PDF file
            - 🌙 Night mode for comfortable reading
            - 🌐 English & Bahasa Indonesia
            - 🔗 Set as default PDF app
            - **Zero ads. Free forever.**

            ---
            Created by: **Ir. Riovan Styx Roring**
            📱 [TikTok](https://www.tiktok.com/@ir.riovansroring) · [Instagram](https://www.instagram.com/ir.riovansroring/) · [YouTube](https://youtube.com/@ir.riovanroring)
          files: |
            dist/PDFNoAds-v1.0.1.apk
            dist/PDFNoAds-v1.0.1.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Test builds from feature branches: publish a prerelease with a direct
      # APK download link, without touching the stable v1.0.1 release.
      - name: Publish test build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: "🧪 Test build (latest from feature branch)"
          body: |
            Unstable test build for on-device testing — **not** the public release.

            Download `PDFNoAds-v1.0.1.apk` below, then on your phone:
            Settings → Security → Allow unknown sources → open the APK to install.

            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
          files: |
            dist/PDFNoAds-v1.0.1.apk
            dist/PDFNoAds-v1.0.1.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
