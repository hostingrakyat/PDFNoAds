name: Build & Release APK

on:
  push:
    branches:
      - claude/flutter-pdf-reader-app-qwd5Q
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PDFNoAds-v1.0.0.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFNoAds-APK
          path: dist/PDFNoAds-v1.0.0.apk
          retention-days: 90

      - name: Delete existing release if present
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          git push --delete origin v1.0.0 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF No Ads v1.0.0 — Free PDF Reader"
          body: |
            ## PDF No Ads — Free PDF Reader, No Ads, Forever

            **Day 1 of 365 Days App Challenge by Ir. Riovan Styx Roring**

            ### Install
            1. Download `PDFNoAds-v1.0.0.apk` below
            2. On your Android phone: Settings → Security → Allow unknown sources
            3. Open the downloaded APK and install

            ### Features
            - 📄 Open & read any PDF file
            - 🌙 Night mode for comfortable reading
            - 🌐 English & Bahasa Indonesia
            - 🔗 Set as default PDF app
            - **Zero ads. Free forever.**

            ---
            Created by: **Ir. Riovan Styx Roring**
            📱 [TikTok](https://www.tiktok.com/@ir.riovansroring) · [Instagram](https://www.instagram.com/ir.riovansroring/) · [YouTube](https://www.youtube.com/@ir.riovansroring)
          files: dist/PDFNoAds-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
