name: pdfnoads
description: PDF No Ads - Free PDF Reader, No Ads, Forever Free
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PDF rendering with a real text layer (PDFium-backed) so users can
  # select & copy text. Also gives centered pages and page-by-page scrolling.
  pdfrx: ^1.3.5

  # File picker using Android SAF (built-in, no downloads)
  file_picker: ^8.0.7

  # Lightweight key-value storage
  shared_preferences: ^2.3.2

  # Open social media URLs
  url_launcher: ^6.3.0

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
